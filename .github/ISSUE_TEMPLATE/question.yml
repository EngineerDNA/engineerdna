name: Question
description: Ask a question about EngineerDNA
title: "[Question]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about using EngineerDNA? We're here to help!

        Before asking, please check:
        - [README.md](https://github.com/EngineerDNA/engineerdna/blob/main/README.md)
        - [CONTRIBUTING.md](https://github.com/EngineerDNA/engineerdna/blob/main/CONTRIBUTING.md)
        - [Existing discussions](https://github.com/EngineerDNA/engineerdna/discussions)
        - [Existing issues](https://github.com/EngineerDNA/engineerdna/issues)

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: How do I...?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Question Category
      description: What area is your question about?
      options:
        - Installation and Setup
        - Configuration
        - Plugin Development
        - Data Sources
        - Data Export
        - Metrics and Analytics
        - API Usage
        - Troubleshooting
        - Contributing
        - General Usage
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any relevant context or what you've tried
      placeholder: |
        I'm trying to...
        I've already tried...
        I expected...

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other information that might help answer your question
      placeholder: Screenshots, configuration snippets, error messages, etc.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      description: Please confirm the following
      options:
        - label: I have checked the documentation and existing issues
          required: true
        - label: I have provided enough context to understand my question
          required: true
