name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! Please describe the feature in detail below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Need
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm frustrated when... or I need to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: I would like EngineerDNA to...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - Plugin System
        - Data Sources (GitHub, Jira, CSV)
        - Data Export/Destinations
        - Metrics and Analytics
        - Identity Resolution
        - Anonymization
        - User Interface
        - API
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I've tried... but it doesn't work because...

  - type: textarea
    id: examples
    attributes:
      label: Example Use Cases
      description: Describe one or more specific examples of how you would use this feature
      placeholder: |
        1. As a team lead, I would use this to...
        2. When analyzing metrics, I could...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request
      placeholder: Mockups, links to similar features in other tools, etc.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      description: Please confirm the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have described the feature and its use cases clearly
          required: true
        - label: This feature aligns with EngineerDNA's goals (engineering metrics and insights)
          required: false
